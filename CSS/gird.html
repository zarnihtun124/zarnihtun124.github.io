<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gird</title>
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <h1>Gird lesson</h1>
    <div class="girdOne">
        <div style="background-color: aqua;">1</div>
        <div style="background-color: black;">2</div>
        <div style="background-color: blueviolet;">3</div>
        <div style="background-color: black;">4</div>
        <div style="background-color: blueviolet;">5</div>
        <div style="background-color: brown;">6</div>
        <div style="background-color: blue;">7</div>
        <div style="background-color: palevioletred;">8</div>
        <div style="background-color: yellowgreen;">9</div>
        <div style="background-color: violet;">10</div>
    </div>
    <h1>Gird  Column Add</h1>
    <div class="girdTwo">
        <div style="background-color: aqua;" class="columnadd">1</div>
        <div style="background-color: black;">2</div>
        <div style="background-color: blueviolet;">3</div>
        <div style="background-color: black;">4</div>
        <div style="background-color: blueviolet;">5</div>
        <div style="background-color: brown;">6</div>
        <div style="background-color: blue;">7</div>
        <div style="background-color: palevioletred;">8</div>
        <div style="background-color: yellowgreen;">9</div>
        <div style="background-color: violet;">10</div>
    </div>
    <h1>Gird  row Add</h1>
    <div class="girdthree">
        <div style="background-color: aqua;">1</div>
        <div style="background-color: black;">2</div>
        <div style="background-color: blueviolet;">3</div>
        <div style="background-color: black;">4</div>
        <div style="background-color: blueviolet;" class="rowadd">5</div>
        <div style="background-color: brown;">6</div>
        <div style="background-color: blue;">7</div>
        <div style="background-color: palevioletred;">8</div>
        <div style="background-color: yellowgreen;">9</div>
        <div style="background-color: violet;">10</div>
    </div>
</body>
</html>
