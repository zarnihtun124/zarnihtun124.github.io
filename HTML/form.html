<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <form action="request.php" method="get">
        <label for="name">Name</label>
        <input type="text" name="stuName" id="name">

        <label for="email">Email</label>

          <input type="time" name="" id="">

            <input type="range" name="" id="">
            <br><br>
        <button type="submit">Save</button>
